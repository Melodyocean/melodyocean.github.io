<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>內部專案追蹤系統</title>
  <meta name="description" content="本公司內部使用的專案與任務追蹤系統。">
  <meta name="theme-color" content="#2563eb">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="專案追蹤">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 載入中 -->
    <section class="view view-center" id="view-loading">
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted">載入中…</p>
    </section>

    <!-- 在 LINE 等 App 內建瀏覽器開啟時 -->
    <section class="view view-center" id="view-inapp" hidden>
      <img class="app-icon" src="icons/icon-192.png" alt="">
      <h1>請改用瀏覽器開啟</h1>
      <p class="muted">LINE、Facebook 等 App 內建的瀏覽器無法使用 Google 登入。</p>
      <ol class="steps">
        <li>點右上角「⋯」或分享按鈕</li>
        <li>選「用瀏覽器開啟」（Safari 或 Chrome）</li>
      </ol>
      <button class="btn btn-secondary" id="btn-copy-link" type="button">複製網址</button>
      <p class="hint" id="copy-result" role="status"></p>
    </section>

    <!-- 登入 -->
    <section class="view view-center" id="view-login" hidden>
      <img class="app-icon" src="icons/icon-192.png" alt="">
      <h1>內部專案追蹤系統</h1>
      <p class="muted">本公司同仁專用，請用你的 Google 帳號登入。</p>
      <div id="google-button" class="google-button"></div>
      <div class="alert" id="login-error" role="alert" hidden></div>
      <p class="hint" id="login-busy" role="status" hidden>登入中，請稍候…</p>
      <p class="footer-link"><a href="privacy.html">隱私權政策</a></p>
    </section>

    <!-- 登入後的主畫面：內容依網址切換，底部固定分頁列 -->
    <section class="view" id="view-app" hidden>
      <!-- 電腦版（寬度 1024 以上）：左欄選單＋中欄內容＋右欄任務詳情（SPEC 5.6） -->
      <aside class="sidebar" id="sidebar" aria-label="主選單"></aside>
      <div class="main-col">
        <header class="desk-header" id="desk-header"></header>
        <div id="page"></div>
      </div>
      <aside class="pane" id="pane" aria-label="任務詳情">
        <header class="pane-head" id="pane-head"></header>
        <div class="pane-body content" id="pane-body"></div>
      </aside>
      <button class="fab" id="fab" type="button" aria-label="新增" hidden>＋</button>
      <nav class="tabbar" id="tabbar" aria-label="主要分頁"></nav>
    </section>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="modal" id="modal" hidden></div>

  <script src="config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/home.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/task-view.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/search.js"></script>
  <script src="js/admin-records.js"></script>
  <script>App.start();</script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
